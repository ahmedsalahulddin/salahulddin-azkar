# Regenerate with:
#   python3 tools/make_icon.py && dart run flutter_launcher_icons
#
# icon.png and foreground.png are both derived from assets/icon/artwork.jpg
# and are deliberately different pictures: the square keeps the ornamented
# border, the adaptive foreground is the medallion alone, cut to its circle
# and dropped to the size Android guarantees will survive its mask.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: true
  # Adaptive icons keep the mark clear of whatever shape the launcher crops to.
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/icon/foreground.png"

  ios: true
  # iOS rejects icons with an alpha channel.
  remove_alpha_ios: true

  web:
    generate: true
    background_color: "#0D0D0D"
    theme_color: "#D4A843"
