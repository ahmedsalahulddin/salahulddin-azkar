<style>
:root {
  --gold: #d4a843;
  --gold-glow: rgba(212,168,67,.14);
  --border: rgba(184,134,11,.3);
  --bg: #0b0b0b;
  --card: #161616;
  --text: #f0ebe0;
  --muted: #8a7f6c;
  --r: 16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:'Noto Naskh Arabic','Noto Sans','Noto Sans Bengali','Noto Sans Devanagari',system-ui,sans-serif;
  line-height:1.8;min-height:100vh;
}
body[dir=ltr]{font-family:'Noto Sans','Noto Sans Bengali','Noto Sans Devanagari',system-ui,sans-serif}
nav{
  position:sticky;top:0;z-index:10;background:rgba(11,11,11,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;
}
nav a{color:var(--gold);text-decoration:none;font-weight:700;font-size:15px;white-space:nowrap}
nav label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
select{
  background:var(--card);color:var(--text);border:1px solid var(--border);
  border-radius:10px;padding:6px 10px;font:inherit;font-size:14px;
}
main{max-width:760px;margin:0 auto;padding:24px 16px 40px}
header{text-align:center;margin-bottom:20px}
h1{color:var(--gold);font-size:clamp(22px,5vw,30px);line-height:1.4;text-wrap:balance}
header p{color:var(--muted);margin-top:6px}
.toc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 22px}
.toc a{
  color:var(--text);text-decoration:none;font-size:13px;
  border:1px solid var(--border);border-radius:999px;padding:5px 12px;
}
.toc a:hover{border-color:var(--gold);color:var(--gold)}
section{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:18px 18px 12px;margin-bottom:14px;scroll-margin-top:70px;
}
h2{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:19px;margin-bottom:8px}
h2 .ic{
  width:36px;height:36px;border-radius:50%;background:var(--gold-glow);
  display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none;
}
ul{padding-inline-start:20px}
li{margin:6px 0;color:var(--text)}
li::marker{color:var(--gold)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px 16px;border-top:1px solid var(--border)}
footer a{color:var(--muted)}
a:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>

pour l’ajouter aux Favoris — il apparaît dans l’onglet Favoris.", "Le compteur de tasbih, la direction de la Qibla et les invocations de la Omra se trouvent sur le même rayon."]}, {"icon": "🕌", "title": "Horaires de prière et adhan", "items": ["Les horaires de prière suivent votre position, ou une ville de votre choix : touchez le lieu sur la carte de prière, ou Compte → Prière → Lieu. Choisissez ensuite la méthode de calcul et l’heure d’Asr.", "Compte → Prière → Alertes des heures de prière : activez l’adhan et autorisez « Alarmes et rappels » pour qu’il retentisse à l’heure, même téléphone verrouillé. Les alertes sont programmées pour les jours à venir et se renouvellent à chaque ouverture de l’application.", "Vous pouvez choisir le son de l’adhan et un rappel avant celui-ci."]}, {"icon": "⏰", "title": "Rappels et Mes rappels", "items": ["Compte → Rappels : adhkar du matin et du soir, et un dhikr ou un verset à l’écran pendant la journée.", "Mes rappels : choisissez une sourate ou des adhkar, les jours voulus, et jusqu’à 6 horaires par jour.", "Quand la notification arrive, touchez-la pour ouvrir directement la sourate ou les adhkar."]}, {"icon": "🎓", "title": "Tahfeez — pour les élèves", "items": ["Connectez-vous avec Google ou Apple et choisissez votre pays la première fois.", "Dans « Enseignants disponibles », filtrez par pays, hommes/femmes/enfants et langue, et voyez les heures libres de chaque enseignant.", "Demandez à rejoindre ou saisissez le code de l’enseignant ; suivez votre demande et discutez avec votre enseignant dans « Mes enseignants ».", "Dès qu’un enseignant vous ajoute à un cercle, il apparaît dans « Mes cercles » ; « Mon dossier » affiche vos évaluations et vos points.", "Votre code figure sous votre nom sur votre carte — c’est ce que voit votre enseignant."]}, {"icon": "👨‍🏫", "title": "Tahfeez — pour les enseignants", "items": ["Dans « Mes enseignants », demandez à être approuvé comme enseignant ; vous recevez un message quand les administrateurs approuvent.", "Première étape : Heures de travail → « Mes heures de travail disponibles ».", "Créez un cercle dans « Mes cercles » et ouvrez-le : élèves, séances et calendrier pour choisir les jours et heures des séances.", "Notez chaque élève à chaque séance : excellent 10, très bien 7, bien 5, passable 2, à refaire 0.", "« Mes élèves » regroupe les demandes, les élèves classés par points et le dossier de chaque élève par cercle.", "Le point d’interrogation (?) en haut de Tahfeez relance la visite guidée à tout moment."]}, {"icon": "👤", "title": "Compte", "items": ["La connexion est facultative et garde vos favoris et marque-pages sur tous vos appareils — l’icône aux deux flèches synchronise.", "Touchez votre photo pour la changer.", "Mes messages : écrivez aux administrateurs pour toute demande, tout problème ou toute suggestion ; la réponse arrive ici.", "Enseignants masqués : faites réapparaître tout enseignant que vous avez masqué de la liste.", "Paramètres : horaires de prière, rappels, téléchargements (récitateurs et livres hors ligne) et taille du texte.", "À propos : nous contacter, ainsi que sources et crédits."]}, {"icon": "🌐", "title": "Langue et confidentialité", "items": ["Changez la langue de l’application depuis l’écran d’accueil ou les paramètres — l’application existe en dix langues.", "Toutes les sources sont d’Ahl as-Sunna wal-Jamâ‘a et sont listées dans « Sources et crédits ».", "Vous pouvez supprimer définitivement votre compte depuis Compte, ou depuis la page de suppression de compte sur le site web."]}], "footer": "Azkar Salahulddin — gratuite et sans publicité"}, "ur": {"title": "Azkar Salahulddin — صارف رہنما", "sub": "ایپ کے ہر حصے اور اس کے استعمال کا مختصر تعارف", "langLabel": "زبان", "back": "ڈاؤن لوڈ صفحہ", "sections": [{"icon": "🏠", "title": "ہوم اسکرین", "items": ["نیچے چار ٹیب: پسندیدہ، ہوم، حفظ اور اکاؤنٹ۔", "ہوم شیلفوں میں ترتیب دیا گیا ہے: قرآن مجید، اذکار، اسلامی قصے، دروس، لائبریری اور مبارکباد کارڈ — شیلف کو دائیں بائیں سرکائیں اور کوئی بھی کارڈ کھولیں۔", "اوپر نماز کے اوقات کا کارڈ اگلی نماز تک باقی وقت دکھاتا ہے؛ دوسرا شہر چننے کے لیے اس پر مقام کو دبائیں۔", "اوپر والا سرچ بار پوری ایپ میں تلاش کرتا ہے۔"]}, {"icon": "📖", "title": "قرآن مجید", "items": ["مصحف: مدینہ مصحف کے مکمل صفحات، آڈیو تلاوت، تفسیر اور آخری صفحے کے بُک مارک کے ساتھ۔", "قرآن کے تراجم: آیات کا مفہوم کئی زبانوں میں، اہلِ سنت کے مصادر سے (QuranEnc وغیرہ)۔", "تلاوت اور تدبر: ہر آیت چار تفاسیر کے ساتھ، اور قاری کا انتخاب۔", "حفظ کا امتحان: کسی بھی سورت پر خود کو آزمائیں اور اپنے نتائج کا ریکارڈ رکھیں۔", "ریڈیو اور مسلسل سماعت: قرآن ریڈیو اسٹیشن، یا فون لاک ہونے پر بھی بلا تعطل تلاوت۔"]}, {"icon": "📿", "title": "اذکار", "items": ["صحیح اذکار (حصن المسلم)، نیز صبح، شام، نماز کے بعد، سونے، سفر اور رقیہ کے اذکار۔", "ذکر گننے کے لیے اسے دبائیں؛ مکمل ہونے پر کاؤنٹر بتا دیتا ہے۔", "پسندیدہ میں شامل کرنے کے لیے ستارہ ★ دبائیں — یہ پسندیدہ ٹیب میں نظر آئے گا۔", "تسبیح کاؤنٹر، قبلہ کی سمت اور عمرہ کی دعائیں اسی شیلف پر ہیں۔"]}, {"icon": "🕌", "title": "نماز کے اوقات اور اذان", "items": ["نماز کے اوقات آپ کے مقام یا آپ کے منتخب کردہ شہر کے مطابق ہوتے ہیں: نماز کارڈ پر مقام کو دبائیں، یا اکاؤنٹ ← نماز ← مقام۔ پھر حساب کا طریقہ اور عصر کا وقت منتخب کریں۔", "اکاؤنٹ ← نماز ← اوقاتِ نماز کے الرٹس: اذان آن کریں اور “الارم اور یاد دہانیاں” کی اجازت دیں تاکہ فون لاک ہونے پر بھی اذان وقت پر ہو۔ الرٹس آنے والے دنوں کے لیے سیٹ ہوتے ہیں اور جب بھی آپ ایپ کھولیں، نئے ہو جاتے ہیں۔", "آپ اذان کی آواز اور اس سے پہلے ایک یاد دہانی منتخب کر سکتے ہیں۔"]}, {"icon": "⏰", "title": "یاد دہانیاں اور میری یاد دہانیاں", "items": ["اکاؤنٹ ← یاد دہانیاں: صبح و شام کے اذکار، اور دن میں اسکرین پر کوئی ذکر یا آیت۔", "میری یاد دہانیاں: کوئی سورت یا اذکار، مطلوبہ دن، اور دن میں 6 اوقات تک منتخب کریں۔", "نوٹیفکیشن آنے پر اسے دبائیں، سورت یا اذکار فوراً کھل جائیں گے۔"]}, {"icon": "🎓", "title": "حفظ — طلبہ کے لیے", "items": ["پہلی بار Google یا Apple سے سائن اِن کریں اور اپنا ملک منتخب کریں۔", "“دستیاب اساتذہ” میں ملک، مرد/خواتین/بچے اور زبان کے لحاظ سے فلٹر کریں، اور ہر استاد کے فارغ اوقات دیکھیں۔", "شامل ہونے کی درخواست دیں یا استاد کا کوڈ لکھیں؛ “میرے اساتذہ” میں اپنی درخواست دیکھیں اور استاد سے بات کریں۔", "جب استاد آپ کو کسی حلقے میں شامل کرے تو وہ “میرے حلقے” میں نظر آئے گا؛ “میرا ریکارڈ” آپ کی جانچ اور پوائنٹس دکھاتا ہے۔", "آپ کا کوڈ آپ کے کارڈ پر نام کے نیچے ہے — یہی آپ کے استاد کو نظر آتا ہے۔"]}, {"icon": "👨‍🏫", "title": "حفظ — اساتذہ کے لیے", "items": ["“میرے اساتذہ” میں بطور استاد منظوری کی درخواست دیں؛ ایڈمن کی منظوری پر آپ کو پیغام ملے گا۔", "پہلا قدم: کام کے اوقات ← “میرے دستیاب کام کے اوقات”۔", "“میرے حلقے” میں حلقہ بنائیں اور اسے کھولیں: طلبہ، نشستیں اور کیلنڈر جس سے نشستوں کے دن اور اوقات منتخب کریں۔", "ہر نشست میں ہر طالب علم کو نمبر دیں: ممتاز 10، بہت اچھا 7، اچھا 5، قابلِ قبول 2، دوبارہ سنائیں 0۔", "“میرے طلبہ” میں درخواستیں، پوائنٹس کے لحاظ سے ترتیب دیے گئے طلبہ، اور ہر حلقے میں ہر طالب علم کا ریکارڈ ہے۔", "حفظ کے اوپر سوالیہ نشان (?) کسی بھی وقت اسکرین کا تعارفی دورہ دوبارہ دکھاتا ہے۔"]}, {"icon": "👤", "title": "اکاؤنٹ", "items": ["سائن اِن اختیاری ہے اور آپ کے پسندیدہ اور بُک مارکس آپ کے تمام آلات پر محفوظ رکھتا ہے — دو تیروں والا آئیکن سنک کرتا ہے۔", "تصویر بدلنے کے لیے اپنی تصویر دبائیں۔", "میرے پیغامات: کسی بھی درخواست، مسئلے یا تجویز کے بارے میں ایڈمن کو لکھیں؛ جواب یہیں آئے گا۔", "چھپائے گئے اساتذہ: فہرست سے چھپایا ہوا کوئی بھی استاد واپس لائیں۔", "ترتیبات: نماز کے اوقات، یاد دہانیاں، ڈاؤن لوڈز (آف لائن استعمال کے لیے قراء اور کتب) اور فونٹ کا سائز۔", "ایپ کے بارے میں: ہم سے رابطہ، اور مصادر اور کریڈٹس۔"]}, {"icon": "🌐", "title": "زبان اور رازداری", "items": ["ایپ کی زبان ہوم اسکرین یا ترتیبات سے بدلیں — ایپ دس زبانوں میں دستیاب ہے۔", "تمام مصادر اہلِ سنت والجماعت کے ہیں اور “مصادر اور کریڈٹس” میں درج ہیں۔", "آپ اکاؤنٹ سے، یا ویب سائٹ کے اکاؤنٹ حذف کرنے والے صفحے سے اپنا اکاؤنٹ ہمیشہ کے لیے حذف کر سکتے ہیں۔"]}], "footer": "Azkar Salahulddin — مفت، بغیر اشتہارات کے"}, "id": {"title": "Azkar Salahulddin — Panduan pengguna", "sub": "Tur singkat ke setiap bagian aplikasi dan cara menggunakannya", "langLabel": "Bahasa", "back": "Halaman unduhan", "sections": [{"icon": "🏠", "title": "Layar beranda", "items": ["Empat tab di bawah: Favorit, Beranda, Tahfiz, dan Akun.", "Beranda tersusun dalam rak: Al-Qur’an, Zikir, Kisah Islami, Kajian, Perpustakaan, dan Kartu ucapan — geser rak ke samping dan buka kartu mana pun.", "Kartu jadwal salat di bagian atas menghitung mundur ke salat berikutnya; ketuk lokasi di kartu itu untuk memilih kota lain.", "Kolom pencarian di atas menemukan apa saja di seluruh aplikasi."]}, {"icon": "📖", "title": "Al-Qur’an", "items": ["Mushaf: halaman lengkap Mushaf Madinah, dengan murotal audio, tafsir, dan penanda halaman terakhir Anda.", "Terjemahan Al-Qur’an: makna ayat dalam banyak bahasa dari sumber Ahlus Sunnah (QuranEnc dan lainnya).", "Tilawah & tadabur: setiap ayat dengan empat tafsir dan pilihan qari.", "Tes hafalan: uji diri Anda pada surah mana pun dan simpan catatan hasilnya.", "Radio dan dengar tanpa henti: stasiun radio Al-Qur’an, atau tilawah terus-menerus meski ponsel terkunci."]}, {"icon": "📿", "title": "Zikir", "items": ["Zikir sahih (Hisnul Muslim), serta zikir pagi, petang, setelah salat, sebelum tidur, safar, dan ruqyah.", "Ketuk zikir untuk menghitungnya; penghitung memberi tahu saat Anda selesai.", "Ketuk bintang ★ untuk menambahkannya ke Favorit — akan tampil di tab Favorit.", "Penghitung tasbih, arah kiblat, dan doa-doa umrah ada di rak yang sama."]}, {"icon": "🕌", "title": "Jadwal salat dan azan", "items": ["Jadwal salat mengikuti lokasi Anda, atau kota yang Anda pilih: ketuk lokasi pada kartu salat, atau Akun → Salat → Lokasi. Lalu pilih metode perhitungan dan waktu Asar.", "Akun → Salat → Alarm Waktu Salat: aktifkan azan dan izinkan “Alarm & pengingat” agar berbunyi tepat waktu meski ponsel terkunci. Alarm diatur untuk beberapa hari ke depan dan diperbarui setiap kali Anda membuka aplikasi.", "Anda bisa memilih suara azan dan pengingat sebelumnya."]}, {"icon": "⏰", "title": "Pengingat dan Pengingat saya", "items": ["Akun → Pengingat: zikir pagi dan petang, serta zikir atau ayat di layar sepanjang hari.", "Pengingat saya: pilih surah atau zikir, hari yang diinginkan, dan hingga 6 waktu sehari.", "Saat notifikasi masuk, ketuk untuk langsung membuka surah atau zikirnya."]}, {"icon": "🎓", "title": "Tahfiz — untuk murid", "items": ["Masuk dengan Google atau Apple dan pilih negara Anda saat pertama kali.", "Di “Pengajar tersedia”, saring menurut negara, laki-laki/perempuan/anak-anak, dan bahasa, serta lihat jam kosong tiap pengajar.", "Ajukan bergabung atau ketik kode pengajar; pantau permintaan Anda dan mengobrol dengan pengajar di “Pengajar saya”.", "Setelah pengajar menambahkan Anda ke halaqah, halaqah itu tampil di “Halaqah saya”; “Catatan saya” menampilkan penilaian dan poin Anda.", "Kode Anda ada di bawah nama pada kartu Anda — itulah yang dilihat pengajar."]}, {"icon": "👨‍🏫", "title": "Tahfiz — untuk pengajar", "items": ["Di “Pengajar saya”, ajukan persetujuan sebagai pengajar; Anda mendapat pesan saat admin menyetujuinya.", "Langkah pertama: Jam kerja → “Jam kerja saya yang tersedia”.", "Buat halaqah di “Halaqah saya” lalu buka: murid, sesi, dan kalender untuk memilih hari dan jam sesi.", "Nilai setiap murid per sesi: istimewa 10, sangat baik 7, baik 5, cukup 2, ulangi 0.", "“Murid saya” berisi permintaan, murid yang diurutkan menurut poin, dan catatan tiap murid per halaqah.", "Tanda tanya (?) di atas Tahfiz memutar ulang tur di layar kapan saja."]}, {"icon": "👤", "title": "Akun", "items": ["Masuk bersifat opsional dan menyimpan favorit serta penanda Anda di semua perangkat — ikon dua panah untuk sinkronisasi.", "Ketuk foto Anda untuk menggantinya.", "Pesan saya: tulis kepada admin tentang permintaan, masalah, atau saran apa pun; balasannya masuk di sini.", "Guru yang disembunyikan: tampilkan kembali pengajar yang Anda sembunyikan dari daftar.", "Pengaturan: jadwal salat, pengingat, unduhan (qari dan buku untuk dipakai offline), dan ukuran huruf.", "Tentang: hubungi kami, serta sumber & kredit."]}, {"icon": "🌐", "title": "Bahasa dan privasi", "items": ["Ganti bahasa aplikasi dari layar beranda atau pengaturan — aplikasi tersedia dalam sepuluh bahasa.", "Semua sumber berasal dari Ahlus Sunnah wal Jama’ah dan tercantum di “Sumber & Kredit”.", "Anda dapat menghapus akun secara permanen dari Akun, atau dari halaman penghapusan akun di situs web."]}], "footer": "Azkar Salahulddin — gratis, tanpa iklan"}, "ms": {"title": "Azkar Salahulddin — Panduan pengguna", "sub": "Lawatan ringkas ke setiap bahagian aplikasi dan cara menggunakannya", "langLabel": "Bahasa", "back": "Halaman muat turun", "sections": [{"icon": "🏠", "title": "Skrin utama", "items": ["Empat tab di bawah: Kegemaran, Utama, Tahfiz dan Akaun.", "Skrin Utama disusun dalam rak: Al-Quran, Zikir, Kisah Islam, Kuliah, Perpustakaan dan Kad ucapan — leret rak ke tepi dan buka mana-mana kad.", "Kad waktu solat di atas mengira detik ke solat seterusnya; ketik lokasi padanya untuk memilih bandar lain.", "Bar carian di atas mencari apa sahaja dalam seluruh aplikasi."]}, {"icon": "📖", "title": "Al-Quran", "items": ["Mushaf: halaman penuh Mushaf Madinah, dengan bacaan audio, tafsir dan penanda untuk halaman terakhir anda.", "Terjemahan Al-Quran: makna ayat dalam pelbagai bahasa daripada sumber Ahli Sunnah (QuranEnc dan lain-lain).", "Tilawah & tadabbur: setiap ayat dengan empat tafsir dan pilihan qari.", "Ujian hafazan: uji diri anda pada mana-mana surah dan simpan rekod keputusan anda.", "Radio dan dengar berterusan: stesen radio Al-Quran, atau bacaan tanpa henti walaupun telefon dikunci."]}, {"icon": "📿", "title": "Zikir", "items": ["Zikir sahih (Hisnul Muslim), serta zikir pagi, petang, selepas solat, sebelum tidur, musafir dan ruqyah.", "Ketik zikir untuk mengiranya; pembilang memberitahu apabila anda selesai.", "Ketik bintang ★ untuk menambahnya ke Kegemaran — ia dipaparkan dalam tab Kegemaran.", "Pembilang tasbih, arah kiblat dan doa umrah berada di rak yang sama."]}, {"icon": "🕌", "title": "Waktu solat dan azan", "items": ["Waktu solat mengikut lokasi anda, atau bandar yang anda pilih: ketik lokasi pada kad waktu solat, atau Akaun → Solat → Lokasi. Kemudian pilih kaedah pengiraan dan waktu Asar.", "Akaun → Solat → Makluman Waktu Solat: hidupkan azan dan benarkan “Penggera & peringatan” supaya ia berbunyi tepat pada waktunya walaupun telefon dikunci. Makluman ditetapkan untuk beberapa hari akan datang dan diperbaharui setiap kali anda membuka aplikasi.", "Anda boleh memilih bunyi azan dan peringatan sebelum masuk waktu."]}, {"icon": "⏰", "title": "Peringatan dan Peringatan saya", "items": ["Akaun → Peringatan: zikir pagi dan petang, serta zikir atau ayat di skrin sepanjang hari.", "Peringatan saya: pilih surah atau zikir, hari yang dikehendaki dan sehingga 6 kali sehari.", "Apabila pemberitahuan tiba, ketik untuk terus membuka surah atau zikir tersebut."]}, {"icon": "🎓", "title": "Tahfiz — untuk pelajar", "items": ["Log masuk dengan Google atau Apple dan pilih negara anda pada kali pertama.", "Dalam “Guru yang tersedia”, tapis mengikut negara, lelaki/wanita/kanak-kanak dan bahasa, dan lihat waktu lapang setiap guru.", "Mohon untuk menyertai atau taip kod guru; ikuti permohonan anda dan berbual dengan guru dalam “Guru saya”.", "Apabila guru menambah anda ke halaqah, ia dipaparkan dalam “Halaqah saya”; “Rekod saya” menunjukkan penilaian dan mata anda.", "Kod anda berada di bawah nama pada kad anda — itulah yang dilihat oleh guru anda."]}, {"icon": "👨‍🏫", "title": "Tahfiz — untuk guru", "items": ["Dalam “Guru saya”, mohon kelulusan sebagai guru; anda akan menerima mesej apabila pentadbir meluluskannya.", "Langkah pertama: Waktu bekerja → “Waktu bekerja saya yang tersedia”.", "Cipta halaqah dalam “Halaqah saya” dan bukanya: pelajar, sesi dan kalendar untuk memilih hari dan masa sesi.", "Beri markah setiap pelajar bagi setiap sesi: cemerlang 10, sangat baik 7, baik 5, memuaskan 2, perlu ulang 0.", "“Pelajar saya” mengandungi permohonan, pelajar disusun mengikut mata, dan rekod setiap pelajar bagi setiap halaqah.", "Tanda soal (?) di atas Tahfiz memainkan semula panduan di skrin pada bila-bila masa."]}, {"icon": "👤", "title": "Akaun", "items": ["Log masuk adalah pilihan dan menyimpan kegemaran serta penanda anda di semua peranti — ikon dua anak panah untuk segerak.", "Ketik gambar anda untuk menukarnya.", "Mesej saya: tulis kepada pentadbir tentang sebarang permohonan, masalah atau cadangan; balasan akan tiba di sini.", "Guru yang disembunyikan: kembalikan mana-mana guru yang anda sembunyikan daripada senarai.", "Tetapan: waktu solat, peringatan, muat turun (qari dan buku untuk kegunaan luar talian) dan saiz fon.", "Tentang: hubungi kami, serta sumber & penghargaan."]}, {"icon": "🌐", "title": "Bahasa dan privasi", "items": ["Tukar bahasa aplikasi dari skrin utama atau tetapan — aplikasi ini tersedia dalam sepuluh bahasa.", "Semua sumber adalah daripada Ahli Sunnah Wal Jamaah dan disenaraikan dalam “Sumber & Penghargaan”.", "Anda boleh memadam akaun anda secara kekal dari Akaun, atau dari halaman pemadaman akaun di laman web."]}], "footer": "Azkar Salahulddin — percuma, tanpa iklan"}, "hi": {"title": "Azkar Salahulddin — उपयोग गाइड", "sub": "ऐप के हर हिस्से और उसके इस्तेमाल का एक छोटा परिचय", "langLabel": "भाषा", "back": "डाउनलोड पेज", "sections": [{"icon": "🏠", "title": "होम स्क्रीन", "items": ["नीचे चार टैब: पसंदीदा, होम, हिफ़्ज़ और खाता।", "होम शेल्फ़ में सजा है: क़ुरआन मजीद, अज़कार, इस्लामी क़िस्से, दुरूस, लाइब्रेरी और मुबारकबाद कार्ड — शेल्फ़ को बगल में स्वाइप करें और कोई भी कार्ड खोलें।", "ऊपर नमाज़ के समय का कार्ड अगली नमाज़ तक का बचा समय दिखाता है; दूसरा शहर चुनने के लिए उस पर लोकेशन टैप करें।", "ऊपर का सर्च बार पूरे ऐप में खोजता है।"]}, {"icon": "📖", "title": "क़ुरआन मजीद", "items": ["मुसहफ़: मदीना मुसहफ़ के पूरे पन्ने, ऑडियो तिलावत, तफ़सीर और आपके आख़िरी पन्ने के बुकमार्क के साथ।", "क़ुरआन के अनुवाद: आयतों का अर्थ कई भाषाओं में, अहले सुन्नत के स्रोतों से (QuranEnc आदि)।", "तिलावत और तदब्बुर: हर आयत चार तफ़सीरों के साथ, और क़ारी चुनने की सुविधा।", "हिफ़्ज़ टेस्ट: किसी भी सूरह पर ख़ुद को परखें और अपने नतीजों का रिकॉर्ड रखें।", "रेडियो और लगातार सुनना: क़ुरआन रेडियो स्टेशन, या फ़ोन लॉक होने पर भी बिना रुके तिलावत।"]}, {"icon": "📿", "title": "अज़कार", "items": ["सहीह अज़कार (हिस्नुल मुस्लिम), साथ ही सुबह, शाम, नमाज़ के बाद, सोने, सफ़र और रुक़्या के अज़कार।", "ज़िक्र गिनने के लिए उसे टैप करें; पूरा होने पर काउंटर बता देता है।", "पसंदीदा में जोड़ने के लिए सितारे ★ पर टैप करें — यह पसंदीदा टैब में दिखेगा।", "तस्बीह काउंटर, क़िबला की दिशा और उमरा की दुआएँ इसी शेल्फ़ पर हैं।"]}, {"icon": "🕌", "title": "नमाज़ के समय और अज़ान", "items": ["नमाज़ के समय आपकी लोकेशन या आपके चुने हुए शहर के हिसाब से होते हैं: नमाज़ कार्ड पर लोकेशन टैप करें, या खाता → नमाज़ → लोकेशन। फिर गणना का तरीक़ा और अस्र का समय चुनें।", "खाता → नमाज़ → नमाज़ समय अलर्ट: अज़ान चालू करें और “अलार्म और रिमाइंडर” की अनुमति दें ताकि फ़ोन लॉक होने पर भी अज़ान समय पर हो। अलर्ट आने वाले दिनों के लिए सेट होते हैं और हर बार ऐप खोलने पर नए हो जाते हैं।", "आप अज़ान की आवाज़ और उससे पहले एक रिमाइंडर चुन सकते हैं।"]}, {"icon": "⏰", "title": "रिमाइंडर और मेरे रिमाइंडर", "items": ["खाता → रिमाइंडर: सुबह और शाम के अज़कार, और दिन में स्क्रीन पर कोई ज़िक्र या आयत।", "मेरे रिमाइंडर: कोई सूरह या अज़कार, मनचाहे दिन, और दिन में 6 बार तक चुनें।", "नोटिफ़िकेशन आने पर उस पर टैप करें, सूरह या अज़कार तुरंत खुल जाएँगे।"]}, {"icon": "🎓", "title": "हिफ़्ज़ — छात्रों के लिए", "items": ["पहली बार Google या Apple से साइन इन करें और अपना देश चुनें।", "“उपलब्ध शिक्षक” में देश, पुरुष/महिला/बच्चे और भाषा से फ़िल्टर करें, और हर शिक्षक के ख़ाली घंटे देखें।", "जुड़ने का अनुरोध भेजें या शिक्षक का कोड लिखें; “मेरे शिक्षक” में अपना अनुरोध देखें और शिक्षक से बात करें।", "जब शिक्षक आपको किसी हलक़े में जोड़ दे तो वह “मेरे हलक़े” में दिखेगा; “मेरा रिकॉर्ड” आपके मूल्यांकन और पॉइंट दिखाता है।", "आपका कोड आपके कार्ड पर नाम के नीचे है — यही आपके शिक्षक को दिखता है।"]}, {"icon": "👨‍🏫", "title": "हिफ़्ज़ — शिक्षकों के लिए", "items": ["“मेरे शिक्षक” में शिक्षक के रूप में मंज़ूरी का अनुरोध करें; एडमिन के मंज़ूर करने पर आपको संदेश मिलेगा।", "पहला क़दम: काम के घंटे → “मेरे उपलब्ध काम के घंटे”।", "“मेरे हलक़े” में हलक़ा बनाएँ और उसे खोलें: छात्र, सत्र और सत्रों के दिन व समय चुनने के लिए कैलेंडर।", "हर सत्र में हर छात्र को अंक दें: उत्कृष्ट 10, बहुत अच्छा 7, अच्छा 5, संतोषजनक 2, दोबारा सुनाएँ 0।", "“मेरे छात्र” में अनुरोध, पॉइंट के हिसाब से क्रमबद्ध छात्र, और हर हलक़े में हर छात्र का रिकॉर्ड है।", "हिफ़्ज़ के ऊपर प्रश्नचिह्न (?) कभी भी स्क्रीन का परिचय-दौरा फिर से दिखाता है।"]}, {"icon": "👤", "title": "खाता", "items": ["साइन इन वैकल्पिक है और आपके पसंदीदा और बुकमार्क आपके सभी डिवाइस पर रखता है — दो तीरों वाला आइकन सिंक करता है।", "अपनी तस्वीर बदलने के लिए उस पर टैप करें।", "मेरे संदेश: किसी भी अनुरोध, समस्या या सुझाव के बारे में एडमिन को लिखें; जवाब यहीं आएगा।", "छिपाए गए शिक्षक: सूची से छिपाए गए किसी भी शिक्षक को वापस लाएँ।", "सेटिंग्स: नमाज़ के समय, रिमाइंडर, डाउनलोड (ऑफ़लाइन इस्तेमाल के लिए क़ारी और किताबें) और फ़ॉन्ट का आकार।", "परिचय: हमसे संपर्क करें, और स्रोत और श्रेय।"]}, {"icon": "🌐", "title": "भाषा और निजता", "items": ["ऐप की भाषा होम स्क्रीन या सेटिंग्स से बदलें — ऐप दस भाषाओं में उपलब्ध है।", "सभी स्रोत अहले सुन्नत वल जमाअत के हैं और “स्रोत और श्रेय” में दर्ज हैं।", "आप खाता से, या वेबसाइट के खाता हटाने वाले पेज से अपना खाता हमेशा के लिए हटा सकते हैं।"]}], "footer": "Azkar Salahulddin — मुफ़्त, बिना विज्ञापन"}, "tr": {"title": "Azkar Salahulddin — Kullanım kılavuzu", "sub": "Uygulamanın her bölümüne ve nasıl kullanılacağına kısa bir bakış", "langLabel": "Dil", "back": "İndirme sayfası", "sections": [{"icon": "🏠", "title": "Ana ekran", "items": ["Altta dört sekme: Favoriler, Ana Sayfa, Hıfız ve Hesabım.", "Ana sayfa raflara ayrılmıştır: Kur’an-ı Kerim, Zikirler, İslami kıssalar, Dersler, Kütüphane ve Tebrik kartları — bir rafı yana kaydırın ve istediğiniz kartı açın.", "Üstteki namaz vakitleri kartı bir sonraki namaza kalan süreyi gösterir; başka bir şehir seçmek için karttaki konuma dokunun.", "Üstteki arama çubuğu tüm uygulamada arama yapar."]}, {"icon": "📖", "title": "Kur’an-ı Kerim", "items": ["Mushaf: Medine Mushafı’nın tüm sayfaları; sesli tilavet, tefsir ve son sayfanız için yer imiyle.", "Kur’an mealleri: ayetlerin anlamı birçok dilde, Ehl-i Sünnet kaynaklarından (QuranEnc ve diğerleri).", "Tilavet ve tefekkür: her ayet dört tefsir ve kari seçeneğiyle.", "Ezber testi: herhangi bir surede kendinizi sınayın ve sonuçlarınızın kaydını tutun.", "Radyo ve kesintisiz dinleme: Kur’an radyo istasyonları ya da telefon kilitliyken bile kesintisiz tilavet."]}, {"icon": "📿", "title": "Zikirler", "items": ["Sahih zikirler (Hısnü’l-Müslim), ayrıca sabah, akşam, namaz sonrası, uyku, yolculuk ve rukye zikirleri.", "Saymak için bir zikre dokunun; sayaç bitirdiğinizde size bildirir.", "Favorilere eklemek için yıldıza ★ dokunun — Favoriler sekmesinde görünür.", "Tesbih sayacı, kıble yönü ve umre duaları aynı raftadır."]}, {"icon": "🕌", "title": "Namaz vakitleri ve ezan", "items": ["Namaz vakitleri konumunuza veya seçtiğiniz bir şehre göre belirlenir: namaz kartındaki konuma dokunun ya da Hesabım → Namaz → Konum. Ardından hesaplama yöntemini ve ikindi vaktini seçin.", "Hesabım → Namaz → Namaz Vakti Uyarıları: ezanı açın ve telefon kilitliyken bile vaktinde okunması için “Alarmlar ve hatırlatıcılar” iznini verin. Uyarılar önümüzdeki günler için kurulur ve uygulamayı her açtığınızda yenilenir.", "Ezan sesini ve öncesinde bir hatırlatma seçebilirsiniz."]}, {"icon": "⏰", "title": "Hatırlatıcılar ve Hatırlatıcılarım", "items": ["Hesabım → Hatırlatıcılar: sabah ve akşam zikirleri, gün içinde de ekranınızda bir zikir veya ayet.", "Hatırlatıcılarım: bir sure veya zikir, istediğiniz günleri ve günde en fazla 6 vakit seçin.", "Bildirim geldiğinde dokunun; sure veya zikir hemen açılır."]}, {"icon": "🎓", "title": "Hıfız — öğrenciler için", "items": ["İlk seferde Google veya Apple ile giriş yapın ve ülkenizi seçin.", "“Mevcut öğretmenler” bölümünde ülkeye, erkek/kadın/çocuk ve dile göre filtreleyin, her öğretmenin boş saatlerini görün.", "Katılma isteği gönderin veya öğretmenin kodunu yazın; isteğinizi takip edin ve “Öğretmenlerim” bölümünde öğretmeninizle yazışın.", "Bir öğretmen sizi bir halkaya eklediğinde “Halkalarım”da görünür; “Kaydım” değerlendirmelerinizi ve puanlarınızı gösterir.", "Kodunuz kartınızda adınızın altındadır — öğretmeninizin gördüğü budur."]}, {"icon": "👨‍🏫", "title": "Hıfız — öğretmenler için", "items": ["“Öğretmenlerim” bölümünden öğretmen olarak onay isteyin; yöneticiler onayladığında bir mesaj alırsınız.", "İlk adım: Çalışma saatleri → “Uygun çalışma saatlerim”.", "“Halkalarım”da bir halka oluşturup açın: öğrenciler, dersler ve ders günlerini ve saatlerini seçmek için takvim.", "Her derste her öğrenciyi notlandırın: mükemmel 10, çok iyi 7, iyi 5, kabul edilebilir 2, tekrar gerekli 0.", "“Öğrencilerim” istekleri, puana göre sıralanmış öğrencileri ve her öğrencinin halka bazında kaydını içerir.", "Hıfız’ın üstündeki soru işareti (?) ekran turunu istediğiniz zaman yeniden gösterir."]}, {"icon": "👤", "title": "Hesabım", "items": ["Giriş yapmak isteğe bağlıdır; favorilerinizi ve yer imlerinizi tüm cihazlarınızda tutar — iki oklu simge senkronize eder.", "Değiştirmek için fotoğrafınıza dokunun.", "Mesajlarım: her türlü istek, sorun veya öneri için yöneticilere yazın; yanıt buraya gelir.", "Gizlediğiniz öğretmenler: listeden gizlediğiniz herhangi bir öğretmeni geri getirin.", "Ayarlar: namaz vakitleri, hatırlatıcılar, indirmeler (çevrimdışı kullanım için kariler ve kitaplar) ve yazı boyutu.", "Hakkında: bize ulaşın, ayrıca kaynaklar ve teşekkürler."]}, {"icon": "🌐", "title": "Dil ve gizlilik", "items": ["Uygulamanın dilini ana ekrandan veya ayarlardan değiştirin — uygulama on dilde sunulur.", "Tüm kaynaklar Ehl-i Sünnet ve’l-Cemaat’tendir ve “Kaynaklar ve Teşekkürler” bölümünde listelenmiştir.", "Hesabınızı Hesabım bölümünden veya web sitesindeki hesap silme sayfasından kalıcı olarak silebilirsiniz."]}], "footer": "Azkar Salahulddin — ücretsiz ve r const RTL = new Set(['ar', 'ur']);
function pick() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q && GUIDE[q]) return q;
  try { const s = localStorage.getItem('guideLang'); if (s && GUIDE[s]) return s; } catch (e) {}
  for (const l of (navigator.languages || [navigator.language || ''])) {
    const c = (l || '').slice(0, 2).toLowerCase();
    if (GUIDE[c]) return c;
  }
  return 'ar';
}
function esc(t) {
  return t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function render(code) {
  const g = GUIDE[code];
  document.documentElement.lang = code;
  document.documentElement.dir = RTL.has(code) ? 'rtl' : 'ltr';
  document.body.dir = document.documentElement.dir;
  document.title = g.title;
  document.getElementById('title').textContent = g.title;
  document.getElementById('sub').textContent = g.sub;
  document.getElementById('langLabel').textContent = g.langLabel;
  document.getElementById('back').textContent = '← ' + g.back;
  document.getElementById('footer').textContent = g.footer;
  document.getElementById('lang').value = code;
  document.getElementById('toc').innerHTML = g.sections
    .map((s, i) => `<a href="#s${i}">${s.icon} ${esc(s.title)}</a>`).join('');
  document.getElementById('sections').innerHTML = g.sections.map((s, i) =>
    `<section id="s${i}"><h2><span class="ic">${s.icon}</span>${esc(s.title)}</h2><ul>` +
    s.items.map(it => `<li>${esc(it)}</li>`).join('') + '</ul></section>').join('');
}
document.getElementById('lang').addEventListener('change', e => {
  const c = e.target.value;
  try { localStorage.setItem('guideLang', c); } catch (err) {}
  const u = new URL(location.href); u.searchParams.set('lang', c);
  history.replaceState(null, '', u);
  render(c);
});
render(pick());
</script>
